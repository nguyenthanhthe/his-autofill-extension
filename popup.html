<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIS V20 - Khám Sức Khỏe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            width: 320px;
            background-color: #f7f9fc;
            color: #333333;
            padding: 14px;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e1e8f0;
            margin-bottom: 12px;
        }
        .logo {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: linear-gradient(135deg, #fa8c16, #ff7a45);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }
        .header-info h1 {
            font-size: 14px;
            font-weight: 700;
            color: #1d39c4;
            line-height: 1.2;
        }
        .header-info p {
            font-size: 11px;
            color: #8c8c8c;
            margin-top: 2px;
        }
        .status-badge {
            background-color: #f6ffed;
            border: 1px solid #b7eb8f;
            color: #389e0d;
            font-size: 11px;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #52c41a;
        }
        .card {
            background: #ffffff;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 10px;
        }
        .card-title {
            font-size: 11px;
            font-weight: 700;
            color: #595959;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .shortcut-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 12px;
        }
        .shortcut-item:last-child {
            margin-bottom: 0;
        }
        .kbd {
            background-color: #f0f2f5;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            padding: 2px 6px;
            font-weight: 700;
            font-size: 11px;
            color: #1d39c4;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }
        .btn-action {
            width: 100%;
            background: #1890ff;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
            margin-top: 6px;
            transition: background 0.2s;
        }
        .btn-action:hover {
            background: #096dd9;
        }
        .footer {
            text-align: center;
            font-size: 10px;
            color: #bfbfbf;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">⚕</div>
        <div class="header-info">
            <h1>HIS V20 - Khám Sức Khỏe</h1>
            <p>Hỗ trợ khám sức khỏe định kỳ</p>
        </div>
    </div>

    <div class="status-badge">
        <span class="status-dot"></span>
        <span>Sẵn sàng hoạt động trên v20.ytecoso.vn</span>
    </div>

    <div class="card">
        <div class="card-title">⌨ Phím tắt nhanh</div>
        <div class="shortcut-item">
            <span>Mở Khám SK từ Tiếp đón:</span>
            <span class="kbd">F6</span>
        </div>
        <div class="shortcut-item">
            <span>Điền kết quả khám & Lưu:</span>
            <span class="kbd">F9</span>
        </div>
        <div class="shortcut-item">
            <span>Lưu Tiếp đón / Khám (Gốc HIS):</span>
            <span class="kbd">F11</span>
        </div>
        <div class="shortcut-item">
            <span>Lưu & Tiếp đón mới (Gốc HIS):</span>
            <span class="kbd">F10</span>
        </div>
    </div>

    <button id="btn-open-his" class="btn-action">🌐 Mở phần mềm HIS V20</button>

    <div class="footer">
        Phiên bản 1.1.0 • Dành cho Cán bộ Y tế
    </div>

    <script src="popup.js"></script>
</body>
</html>
